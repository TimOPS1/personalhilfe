# Hält das kostenlose Supabase-Projekt wach. Ohne Nutzung pausiert es nach 7 Tagen (z. B. in den Ferien).
# Ruft alle 3 Tage die Funktion ph_ping auf. Sie gibt keine Daten heraus und räumt nur alte Tage auf.
# URL und öffentlicher Schlüssel werden aus config.js gelesen, es braucht keine Geheimnisse.
# Hinweis: GitHub schaltet geplante Abläufe in öffentlichen Repos ab, wenn 60 Tage lang nichts
# am Repo geändert wurde. Dann unter "Actions" auf "Enable workflow" klicken.
name: Supabase wach halten

on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ph_ping aufrufen
        run: |
          URL=$(grep -oE 'url: *"[^"]+"' config.js | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'anonKey: *"[^"]+"' config.js | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Kein Supabase in config.js eingetragen, nichts zu tun."; exit 0; fi
          curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/ph_ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
