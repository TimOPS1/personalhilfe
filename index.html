<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Personalhilfe</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F6F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Personalhilfe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#F6F7F3;
    --card:#FFFFFF;
    --ink:#22302A;
    --ink-soft:#5B6960;
    --ink-light:#93A196;
    --teal:#2F6F63;
    --teal-deep:#1F4C43;
    --amber:#E1972F;
    --amber-soft:#FBEBD3;
    --line:#DFE4DD;
    --danger:#C1543A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .app{
    max-width:480px;margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));
  }
  header.top{padding:4px 2px 18px;}
  .eyebrow{font-size:13px;color:var(--ink-light);}
  h1{font-size:24px;margin:2px 0 0;font-weight:650;letter-spacing:-0.01em;color:#4B5C52;}

  .session-bar{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:12px;font-size:14px;color:var(--ink-soft);
  }
  .switch-btn{
    background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:10px;padding:0 14px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .switch-btn:active{background:var(--line);}

  .block-progress{
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
    margin-top:12px;padding:9px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;
  }
  .current-block{font-size:14px;font-weight:600;color:var(--teal-deep);}
  .advance-row{display:flex;gap:8px;}
  .advance-btn{
    border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;
    padding:0 12px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .advance-btn:active{background:var(--line);}
  .block-progress-caption{font-size:12.5px;color:var(--ink-soft);margin-top:6px;padding:0 2px;line-height:1.35;}

  .notify-btn{
    border:1px dashed var(--line);background:transparent;color:var(--teal-deep);
    border-radius:10px;min-height:44px;font-size:14px;font-weight:600;
    cursor:pointer;width:100%;margin-top:12px;
  }

  .overview-card{padding:14px;}
  .overview-summary{display:flex;gap:10px;margin-bottom:12px;}
  .ov-stat{
    flex:1;border-radius:12px;padding:9px 6px;text-align:center;
    font-size:12.5px;color:var(--ink-soft);font-weight:600;
  }
  .ov-stat span{display:block;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:1px;}
  .ov-stat.ov-need{background:var(--amber-soft);}
  .ov-stat.ov-flat{background:var(--bg);}

  .ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  @media (max-width:340px){ .ov-grid{grid-template-columns:repeat(2,1fr);} }
  .ov-cell{border-radius:11px;padding:9px 8px;border:1.5px solid transparent;}
  .ov-cell.ov-need{background:var(--amber-soft);}
  .ov-cell.ov-flat{background:var(--bg);}
  .ov-cell.ov-mine{border-color:var(--teal);}
  .ov-name{font-size:13px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;}
  .ov-label{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .step-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:14px;}
  .stepper-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 2px 0;margin-top:4px;
  }
  .stepper-label{font-size:16px;font-weight:600;color:var(--ink);}
  .stepper-btns{display:flex;gap:10px;}
  .step-btn{
    width:48px;height:48px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-size:22px;font-weight:600;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .step-btn:active{background:var(--bg);}
  .step-btn:disabled{color:var(--line);cursor:default;}
  .need-state{font-size:13px;color:var(--ink-soft);margin-top:10px;line-height:1.35;}
  .need-state.live{color:#8A5A14;font-weight:600;}

  .block-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .block-chip{
    font-size:14px;padding:0 12px;min-height:44px;border-radius:10px;border:1px solid var(--line);
    color:var(--ink-soft);cursor:pointer;background:var(--card);font-weight:500;
  }
  .block-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
  /* Ausgewählt, aber noch nicht gemeldet */
  .block-chip.draft{background:#E4F1EC;border:1.5px dashed var(--teal);color:var(--teal-deep);font-weight:600;}
  .block-chip.covered{background:#E4F1EC;border-color:transparent;color:var(--teal-deep);cursor:default;font-weight:600;}
  .block-chip:disabled{color:var(--ink-light);background:var(--bg);text-decoration:line-through;cursor:default;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px;
  }
  .card h2{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px;font-weight:600;}
  .mine .name{font-size:19px;font-weight:650;}

  .need-card{border-left:3px solid var(--amber);padding-left:12px;}
  .need-title{font-size:16px;font-weight:600;}
  .need-sub{font-size:14px;color:var(--ink-soft);margin-top:3px;}

  button.help-btn{
    border:none;background:var(--teal);color:#fff;border-radius:12px;
    padding:0 16px;min-height:48px;font-size:15px;font-weight:600;cursor:pointer;
    width:100%;margin-top:10px;transition:.15s;
  }
  button.help-btn:active{transform:scale(0.98);}
  button.help-btn:disabled{background:var(--line);color:var(--ink-soft);cursor:default;}

  button.danger-btn{
    border:1px solid #EBC9C0;background:#FBF1EE;color:var(--danger);
    border-radius:10px;padding:0 12px;min-height:44px;font-size:14px;font-weight:600;cursor:pointer;
  }
  button.danger-btn:active{background:#F5DED7;}

  .empty{color:var(--ink-soft);font-size:14px;padding:6px 2px;}

  .flow-row{
    display:flex;align-items:center;gap:8px;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap;
  }
  .flow-row:last-child{border-bottom:none;}
  .flow-badge{
    background:var(--teal-deep);color:#fff;border-radius:8px;
    padding:3px 8px;font-size:13px;font-weight:600;
  }
  .flow-arrow{color:var(--ink-soft);}
  .flow-time{margin-left:auto;font-size:13px;color:var(--ink-soft);}
  .flow-actions{width:100%;display:flex;justify-content:flex-end;}

  .admin-label{font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-top:14px;display:block;}
  .admin-label:first-child{margin-top:0;}
  .admin-select{
    width:100%;padding:0 10px;min-height:48px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-size:16px;color:var(--ink);margin-top:6px;
  }

  .login-list{display:flex;flex-direction:column;gap:8px;}
  .login-row{
    display:flex;justify-content:space-between;align-items:center;width:100%;
    border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:52px;
    cursor:pointer;background:var(--card);font-size:16px;color:var(--ink);text-align:left;
  }
  .login-row:active{background:var(--bg);}
  .login-hint{font-size:13px;color:var(--ink-soft);margin-top:10px;line-height:1.4;}

  .local-note{margin-top:12px;padding:10px 12px;background:var(--amber-soft);color:#8A5A14;border-radius:10px;font-size:13px;line-height:1.4;}
  .error-note{margin:0 0 12px;padding:10px 12px;background:#FBF1EE;color:var(--danger);border-radius:10px;font-size:13px;line-height:1.4;}

  .code-input{width:100%;padding:0 12px;min-height:48px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--card);color:var(--ink);}
  .code-input + .help-btn{margin-top:12px;}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--teal-deep);color:#fff;padding:12px 18px;border-radius:12px;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:85vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- Desktop-Ansicht (Schulleitung) und Matrix ---- */
  body.desk .app{max-width:1500px;padding:20px 28px 60px;}
  .adm-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .adm-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .adm-tools .block-progress{margin-top:0;}
  .adm-tools-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .seg button{border:none;background:transparent;padding:0 12px;min-height:44px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .seg button.on{background:var(--teal);color:#fff;}
  a.switch-btn{text-decoration:none;display:inline-flex;align-items:center;}
  .desk-grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start;margin-top:14px;}
  .mx{display:grid;grid-template-columns:minmax(8.5em,1.1fr) repeat(4,minmax(0,1fr));gap:6px;}
  .mx > div{border-radius:10px;padding:7px 10px;min-height:2.7em;display:flex;flex-direction:column;justify-content:center;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere;}
  .mx .mx-h{font-size:12.5px;font-weight:700;color:var(--ink-soft);background:transparent;justify-content:flex-end;border-radius:0;}
  .mx .mx-h.mx-now{color:var(--teal-deep);border-bottom:3px solid var(--teal);}
  .mx .mx-name{font-weight:700;background:var(--bg);}
  .mx .mx-name small{font-weight:500;color:var(--ink-soft);font-size:.85em;}
  .mx .mx-none{background:var(--bg);color:var(--ink-light);}
  .mx .mx-open{background:var(--amber-soft);color:#8A5A14;font-weight:700;}
  .mx .mx-ok{background:#E4F1EC;color:var(--teal-deep);font-weight:600;}
  .mx .mx-ok.mx-cover{background:#E6ECF5;color:#2E4A6E;}
  .mx .mx-cv{color:#2E4A6E;}
  .mx .mx-past{opacity:.4;}
  .mx .mx-click{cursor:pointer;}
  .mx .mx-click:hover{outline:2px solid var(--amber);}
  .mx .mx-sel{outline:2px solid var(--teal);}
  .mx small{display:block;font-weight:500;font-size:.85em;}
  .mode-row{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
  .date-row{display:flex;gap:10px;margin-top:6px;}
  .date-row label{flex:1;min-width:0;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .date-row input{min-width:0;width:100%;}
  .week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .week-title{font-weight:700;color:var(--teal-deep);flex:1;text-align:center;min-width:0;}
  .advance-btn:disabled{opacity:.35;cursor:default;}
  .mx.mx-week{grid-template-columns:minmax(6.5em,1fr) repeat(5,minmax(0,1fr));min-width:560px;}
  .mx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .mx .mx-free{background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 6px,#ECEFE9 6px,#ECEFE9 12px);color:var(--ink-soft);}
  .mx .mx-h small{display:block;font-weight:500;color:var(--ink-soft);}
  .text-input{width:100%;padding:0 10px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--ink);margin-top:6px;font-family:inherit;}
  .hint{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.35;}
  .person-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;flex-wrap:wrap;}
  .person-row:last-child{border-bottom:none;}

  /* ---- Anzeige für den Bildschirm in der Aula (#anzeige) ---- */
  body.display{overflow:hidden;cursor:none;}
  body.display .app{max-width:none;margin:0;padding:2.2vh 2.4vw;height:100vh;}
  .dp{display:flex;flex-direction:column;height:100%;gap:2vh;}
  .dp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw;}
  .dp-date{font-size:clamp(14px,1.5vw,32px);color:var(--ink-soft);}
  .dp-title{font-size:clamp(24px,3vw,64px);font-weight:700;color:#4B5C52;line-height:1.1;letter-spacing:-0.01em;}
  .dp-right{display:flex;align-items:center;gap:1.4vw;}
  .dp-block{font-size:clamp(14px,1.6vw,34px);font-weight:700;color:var(--teal-deep);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6vh 1.2vw;}
  .dp-stat{font-size:clamp(12px,1.2vw,26px);font-weight:600;color:var(--ink-soft);border-radius:14px;padding:.6vh 1.2vw;text-align:center;}
  .dp-stat b{display:block;font-size:1.6em;color:var(--ink);line-height:1.1;}
  .dp-stat.need{background:var(--amber-soft);} .dp-stat.flat{background:var(--card);border:1px solid var(--line);}
  .dp-stand{font-size:clamp(11px,.9vw,20px);color:var(--ink-light);text-align:right;}
  .dp-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2.5fr) minmax(0,1fr);gap:2vw;}
  .dp-matrix{min-height:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2vh 1vw;}
  .dp-matrix .mx{height:100%;gap:.6vh .5vw;grid-template-columns:minmax(13em,1.7fr) repeat(4,minmax(0,1fr));}
  .dp-matrix .mx-name small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.74em;line-height:1.15;margin-top:.1em;}
  .dp-matrix .mx > div{line-height:1.12;overflow:hidden;}
  .dp-matrix .mx > div{font-size:clamp(12px,1.25vw,26px);min-height:0;padding:.3vh .7vw;}
  .dp-matrix .mx .mx-h{font-size:clamp(12px,1.1vw,24px);}
  .dp-side{min-height:0;display:flex;flex-direction:column;gap:2vh;overflow:hidden;}
  .dp-side .card{margin:0;overflow:hidden;font-size:clamp(13px,1.2vw,26px);}
  .dp-side h2{font-size:1em;margin-bottom:.8vh;}
  .dp-side .person-row{font-size:1em;padding:.7vh 0;}
  .dp-offline{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);background:var(--danger);color:#fff;padding:1vh 2vw;border-radius:12px;font-size:clamp(14px,1.4vw,28px);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="backend.js"></script>
<script>
// ---------- Konfiguration (siehe config.js) ----------
const DAY_BLOCKS = ['1. Block','2. Block','Mittagessen','3. Block'];
const USER_CFG = window.PERSONALHILFE_CONFIG || {};
const CFG = Object.assign({
  classes: ['Klasse A','Klasse B','Klasse C'],
  blockEnds: ['10:30','11:45','12:45','14:25'],
  adminPasswordHash: '',
  demoData: false,
  localOnlyNotice: true
}, USER_CFG);
CFG.features = Object.assign({notifications:false}, USER_CFG.features || {});
const STORAGE_KEY = 'personalhilfe.user';
const STATE_KEY = 'personalhilfe.state';
const CODE_KEY = 'personalhilfe.code';
const TOKEN_KEY = 'personalhilfe.admintoken';
// Gemeinsamer Betrieb nur, wenn backend.js mit gültiger Supabase-Konfiguration geladen wurde
const BACKEND = window.PH_BACKEND || null;
const REMOTE = !!BACKEND;

function esc(s){
  return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// ---------- Klassen ----------
// Kennung aus dem Namen: Umlaute ausschreiben, nur Kleinbuchstaben und Ziffern.
// Für Namen ohne Umlaute ergibt das dieselbe Kennung wie frühere Fassungen.
function slug(str){
  return String(str).toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'').slice(0,40);
}
const configErrors = [];
let classes = (()=>{
  const seen = {};
  const out = [];
  (CFG.classes || []).forEach(entry=>{
    const name = String(typeof entry === 'object' && entry ? entry.name : entry);
    const id = typeof entry === 'object' && entry && entry.id ? String(entry.id) : slug(name);
    if(!/^[a-z0-9_-]{1,40}$/.test(id)){
      configErrors.push(`„${name}“ hat keine gültige Kennung (nur a–z, 0–9, - und _).`);
      return;
    }
    if(seen[id]){
      configErrors.push(`„${seen[id]}“ und „${name}“ ergeben dieselbe Kennung „${id}“. Bitte einen Namen ändern oder eine eigene id angeben.`);
      return;
    }
    seen[id] = name;
    out.push({id, name, need:0, needBlocks:[]});
  });
  return out;
})();

let flows = [];
if(CFG.demoData && classes.length >= 4){
  classes[0].need = 1; classes[0].needBlocks = DAY_BLOCKS.slice();
  classes[2].need = 2; classes[2].needBlocks = DAY_BLOCKS.slice();
  classes[3].need = 1; classes[3].needBlocks = ['Mittagessen'];
  flows = [{id:0, from:classes[1].id, to:classes[0].id, time:'08:55', active:true, blocks:['1. Block','2. Block']}];
}
let flowIdSeq = flows.length;
let currentUser = null; // {type:'class', classId} | {type:'admin'} | null
let myClassId = null;
let pendingSendBlocks = {};
let adminForm = {from:'', to:'', blocks:[], mode:'class', name:''};
let absentForm = {name:'', classId:'', blocks:[]};
let absent = [];   // {id, name, class_id}
let covers = [];   // {id, name, to, blocks, active}
let staffSeq = 0;
let lastRefresh = '';
let lastDesktop = null;
// Planung im Voraus (nur gemeinsamer Betrieb)
let plan = {absent:[], cover:[], free:[], loaded:false};
let adminTab = 'heute';            // 'heute' | 'plan'
let weekOffset = 0;                // 0 = aktuelle Woche
let planSel = null;                // {day, classId} in der Wochenansicht
let planForm = {kind:'absent', name:'', classId:'', from:'', to:'', blocks:[], label:''};
let classPlanForm = {name:'', from:'', to:'', blocks:[]};
const PLAN_DAYS = 183;
const VIEW_KEY = 'personalhilfe.view';
const DISPLAY = (typeof location !== 'undefined') && /^#anzeige/i.test(location.hash || '');
let remoteCode = '';
let adminToken = '';
let remoteLoaded = false;
let remoteFailed = false;
let connectionOk = true;
let remoteStarted = false;
let renderDeferred = false;
let busy = false;

// ---------- Zeiträume ----------
// Im gemeinsamen Betrieb liefert die Datenbank den geltenden Zeitraum und die Endzeiten.
let serverBlockIndex = 0;
let blockEnds = (REMOTE ? [] : CFG.blockEnds).slice();
// Lokal: manueller Eingriff der Schulleitung, gilt bis zum nächsten Uhr-Wechsel
let manualBlock = null; // {index, autoAtSet}

function toMinutes(hhmm){ const [h,m] = String(hhmm).split(':').map(Number); return h*60 + (m||0); }
// Minuten seit Mitternacht. Gemeinsamer Betrieb: deutsche Zeit wie in der Datenbank.
function minutesNow(){
  const d = new Date();
  if(!REMOTE) return d.getHours()*60 + d.getMinutes();
  const p = new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
  const get = t => Number((p.find(x=>x.type===t)||{}).value || 0);
  return get('hour')*60 + get('minute');
}
function autoBlock(){
  const now = minutesNow();
  return blockEnds.filter(e=>toMinutes(e) <= now).length;
}
function curBlock(){
  if(REMOTE) return serverBlockIndex;
  const auto = autoBlock();
  if(!manualBlock) return auto;
  if(auto > manualBlock.autoAtSet) return Math.max(auto, manualBlock.index);
  return manualBlock.index;
}
// Nächster Uhr-Wechsel: dann neu zeichnen bzw. neu laden
let boundaryTimer = null;
function scheduleBoundary(){
  clearTimeout(boundaryTimer);
  const now = minutesNow();
  const next = blockEnds.map(toMinutes).find(m=>m > now);
  if(next === undefined) return;
  const ms = (next - now) * 60000 - new Date().getSeconds()*1000 + 3000;
  boundaryTimer = setTimeout(()=>{ if(REMOTE) refreshRemote(); else safeRender(); scheduleBoundary(); }, Math.max(ms, 1000));
}

// ---------- Lokale Speicherung (pro Gerät, nur für den heutigen Tag) ----------
function todayKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function saveState(){
  if(REMOTE) return;
  try{
    localStorage.setItem(STATE_KEY, JSON.stringify({
      day: todayKey(),
      classes: classes.map(c=>({id:c.id, need:c.need, needBlocks:c.needBlocks})),
      flows, flowIdSeq, manualBlock, absent, covers, staffSeq
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(!raw) return;
    const st = JSON.parse(raw);
    if(st.day !== todayKey()){ localStorage.removeItem(STATE_KEY); return; } // neuer Tag: frisch starten
    classes.forEach(c=>{
      const o = (st.classes||[]).find(x=>x.id===c.id);
      if(o){ c.need = o.need; c.needBlocks = o.needBlocks || []; }
    });
    flows = (st.flows||[]).filter(f=>classes.some(c=>c.id===f.from) && classes.some(c=>c.id===f.to));
    flowIdSeq = st.flowIdSeq || flows.length;
    manualBlock = st.manualBlock || null;
    absent = Array.isArray(st.absent) ? st.absent : [];
    covers = (Array.isArray(st.covers) ? st.covers : []).filter(v=>classes.some(c=>c.id===v.to));
    staffSeq = st.staffSeq || 0;
  }catch(e){}
}

function classNameOf(id){ const c = classes.find(x=>x.id===id); return c? c.name : id; }

function isFutureBlock(b){ return DAY_BLOCKS.indexOf(b) >= curBlock(); }
function futureBlocks(){ return DAY_BLOCKS.filter(isFutureBlock); }
// Zeiträume einer Abwesenheit (leer = ganzer Tag)
function absentBlocks(a){ return (a.blocks && a.blocks.length) ? a.blocks : DAY_BLOCKS; }
function absentLabel(a){ return (a.blocks && a.blocks.length) ? blockLabel(a.blocks) : 'Ganzer Tag'; }
function absentCount(classId, block){
  return absent.filter(a=>a.class_id === classId && absentBlocks(a).includes(block)).length;
}
// Selbst gemeldeter Bedarf gilt nur für die ausdrücklich gewählten Zeiträume
function reportedBlocks(c){
  if(c.need <= 0) return [];
  return DAY_BLOCKS.filter(b=>(c.needBlocks||[]).includes(b) && isFutureBlock(b));
}
// Bedarf in einem Zeitraum: gemeldete Zahl oder Anzahl Abwesender der Klasse, der höhere Wert
function needAt(c, b){
  const reported = (c.need > 0 && (c.needBlocks||[]).includes(b)) ? c.need : 0;
  return Math.max(reported, absentCount(c.id, b));
}
function requiredBlocks(c){
  return DAY_BLOCKS.filter(b=>isFutureBlock(b) && needAt(c, b) > 0);
}
function blockName(){
  const i = curBlock();
  return i < DAY_BLOCKS.length ? DAY_BLOCKS[i] : 'Schultag beendet';
}
// Einsätze, ohne bereits vergangene Zeiträume
function liveFlows(){
  return flows.filter(f=>f.active)
    .map(f=>Object.assign({}, f, {blocks: f.blocks.filter(isFutureBlock)}))
    .filter(f=>f.blocks.length>0);
}
function blockLabel(arr){
  if(arr.length === DAY_BLOCKS.length) return 'Ganzer Tag';
  return DAY_BLOCKS.filter(b=>arr.includes(b)).join(', ');
}
// Wer deckt diesen Zeitraum in dieser Klasse ab? (Einsätze anderer Klassen und namentliche Vertretungen)
function coverNames(classId, block){
  const fromFlows = flows.filter(f=>f.active && f.to===classId && f.blocks.includes(block)).map(f=>classNameOf(f.from));
  const fromCovers = covers.filter(v=>v.active!==false && v.to===classId && v.blocks.includes(block)).map(v=>v.name);
  return fromFlows.concat(fromCovers);
}
function coverCount(classId, block){ return coverNames(classId, block).length; }
// Vertretungen ohne bereits vergangene Zeiträume
function liveCovers(){
  return covers.filter(v=>v.active!==false)
    .map(v=>Object.assign({}, v, {blocks: v.blocks.filter(isFutureBlock)}))
    .filter(v=>v.blocks.length>0);
}
function openBlocksFor(c){
  return requiredBlocks(c).filter(b=>coverCount(c.id,b) < needAt(c, b));
}
function needStatus(c){
  if(requiredBlocks(c).length === 0) return null;
  return openBlocksFor(c).length===0 ? 'done' : 'open';
}

function now(){
  return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2800);
}
function maybeNotify(title, body){
  if(!CFG.features.notifications) return;
  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    try{ new Notification(title, {body}); } catch(e){}
  }
}
async function enableNotifications(){
  if(typeof Notification === 'undefined'){ toast('Push wird von diesem Browser nicht unterstützt.'); return; }
  try{
    const perm = await Notification.requestPermission();
    toast(perm==='granted' ? 'Benachrichtigungen aktiviert' : 'Ohne Erlaubnis kein Hinweis-Ton');
  }catch(e){}
  render();
}

// ---------- Login / Rollen ----------
async function selectClass(id){
  currentUser = {type:'class', classId:id};
  myClassId = id;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); }catch(e){}
  render();
}
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
// Passwort aus dem eigenen Eingabefeld (verdeckt), nicht über prompt()
async function loginAsAdmin(){
  const el = document.getElementById('adminPw');
  const pw = ((el && el.value) || '').trim();
  if(!pw){ toast('Bitte das Passwort eingeben.'); if(el) el.focus(); return; }
  if(REMOTE) return remoteAdminLogin(pw);
  if(!CFG.adminPasswordHash){ toast('Der Schulleitungs-Zugang ist nicht eingerichtet.'); return; }
  let ok = false;
  try{ ok = (await sha256(pw)) === CFG.adminPasswordHash; }
  catch(e){ toast('Passwortprüfung ist in diesem Browser nicht möglich.'); return; }
  if(!ok){ toast('Falsches Passwort'); return; }
  currentUser = {type:'admin'};
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); }catch(e){}

}
async function switchUser(){
  if(currentUser && currentUser.type === 'admin'){
    if(!confirm('Als Schulleitung abmelden?')) return;
    if(REMOTE && adminToken) BACKEND.rpc('ph_admin_logout', {p_token: adminToken}); // Sitzung auch auf dem Server beenden
  }
  currentUser = null; myClassId = null; adminToken = '';
  try{ localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(TOKEN_KEY); }catch(e){}
  render();
}
async function initApp(){
  document.addEventListener('focusout', ()=>{
    if(!renderDeferred) return;
    // kurz warten: wer gerade vom Eingabefeld auf einen Knopf klickt, soll den Knopf noch treffen
    setTimeout(()=>{
      const a = document.activeElement;
      if(a && (a.tagName === 'SELECT' || a.tagName === 'INPUT')) return;
      if(renderDeferred){ renderDeferred = false; render(); }
    }, 350);
  });
  if(!REMOTE) loadState();
  try{
    const raw = DISPLAY ? null : localStorage.getItem(STORAGE_KEY);
    if(raw){
      const u = JSON.parse(raw);
      if(u.type==='admin' || (u.type==='class' && classes.some(c=>c.id===u.classId))){
        currentUser = u;
        if(u.type==='class') myClassId = u.classId;
      }
    }
  }catch(e){ /* noch keine Auswahl gespeichert */ }
  if(REMOTE){
    try{ remoteCode = localStorage.getItem(CODE_KEY) || ''; adminToken = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
    if(DISPLAY){
      // Anzeige: Schulcode darf im Link stehen (#anzeige=CODE), damit der Bildschirm nichts eintippen muss
      const m = /^#anzeige=(.+)$/i.exec(location.hash || '');
      if(m){ try{ remoteCode = decodeURIComponent(m[1]); }catch(e){ remoteCode = m[1]; } }
    }
    if(currentUser && currentUser.type==='admin' && !adminToken) currentUser = null;
    render();
    if(remoteCode) await startRemote();
    return;
  }
  scheduleBoundary();
  setInterval(safeRender, 60000);
  render();
}

// ---------- Aktionen ----------
function toggleSendBlock(classId, block){
  const arr = pendingSendBlocks[classId] || (pendingSendBlocks[classId] = []);
  const i = arr.indexOf(block);
  if(i>=0) arr.splice(i,1); else arr.push(block);
  render();
}
function sendHelp(fromId, toId){
  if(REMOTE) return remoteSend(fromId, toId);
  const from = classes.find(c=>c.id===fromId);
  const to = classes.find(c=>c.id===toId);
  const open = openBlocksFor(to);
  const already = new Set(liveFlows().filter(f=>f.from===fromId && f.to===toId).flatMap(f=>f.blocks));
  const chosen = (pendingSendBlocks[toId]||[]).filter(b=>open.includes(b) && !already.has(b));
  if(chosen.length===0){ toast('Bitte mindestens einen Zeitraum auswählen.'); render(); return; }
  flows.push({id:flowIdSeq++, from:fromId, to:toId, time:now(), active:true, blocks:chosen});
  pendingSendBlocks[toId] = [];
  toast(`${from.name} → ${to.name} · ${chosen.join(', ')}`);
  render();
}
// Zeitraum der eigenen Meldung an- oder abwählen. Vergangene Zeiträume sind nicht wählbar.
// Solange ein Bedarf gemeldet ist, muss mindestens ein kommender Zeitraum gewählt bleiben.
function toggleNeedBlock(classId, block){
  const c = classes.find(x=>x.id===classId);
  const future = futureBlocks();
  let next;
  if(block === 'Ganzer Tag'){
    const allSelected = future.length>0 && future.every(b=>c.needBlocks.includes(b));
    next = allSelected ? [] : future.slice();
  } else {
    if(!future.includes(block)) return;
    next = c.needBlocks.filter(b=>future.includes(b));
    const i = next.indexOf(block);
    if(i>=0) next.splice(i,1); else next.push(block);
  }
  if(c.need > 0 && next.length === 0){
    toast('Mindestens ein Zeitraum muss gewählt bleiben. Zum Zurücknehmen den Bedarf mit − auf 0 setzen.');
    return;
  }
  c.needBlocks = DAY_BLOCKS.filter(b=>next.includes(b));
  render();
  if(REMOTE && c.need>0) pushNeed(c);
}
function requestNeed(classId, qty){
  const c = classes.find(x=>x.id===classId);
  if(qty > 0 && requiredBlocksDraft(c).length === 0){
    toast('Bitte zuerst oben den Zeitraum wählen.');
    return;
  }
  const wasZero = c.need <= 0;
  c.need = Math.max(0, Math.min(9, c.need + qty));
  if(c.need <= 0) c.needBlocks = [];
  if(qty>0){
    toast(`Gemeldet: ${c.need} Erwachsene(r) für ${blockLabel(requiredBlocksDraft(c))}`);
    if(wasZero && !REMOTE) maybeNotify('Personalbedarf', `${c.name} braucht Unterstützung (${blockLabel(requiredBlocksDraft(c))})`);
  } else {
    toast(c.need > 0 ? `Bedarf verringert auf ${c.need}` : 'Bedarf zurückgenommen');
  }
  render();
  if(REMOTE) pushNeed(c);
}
// Gewählte, noch kommende Zeiträume (auch bevor etwas gemeldet ist)
function requiredBlocksDraft(c){ return DAY_BLOCKS.filter(b=>(c.needBlocks||[]).includes(b) && isFutureBlock(b)); }
function endFlow(id){
  const f = flows.find(x=>x.id===id);
  if(f && !confirm(`Unterstützung ${classNameOf(f.from)} → ${classNameOf(f.to)} beenden?`)) return;
  if(REMOTE) return remoteEnd(id);
  if(!f) return;
  f.active = false;
  toast('Unterstützung beendet');
  render();
}
// Zeitraum manuell weiter- oder zurückschalten (nur Schulleitung). Gilt bis zum nächsten
// Uhr-Wechsel, danach schaltet wieder die Uhr. Einsätze werden dabei nicht gelöscht.
async function stepBlock(delta){
  const cur = curBlock();
  const next = Math.max(0, Math.min(DAY_BLOCKS.length, cur + delta));
  if(next === cur) return;
  if(REMOTE){
    if(busy) return;
    busy = true;
    try{
      const res = await remoteCall('ph_admin_set_block', {p_token:adminToken, p_index:next});
      if(res.ok) toast(`Jetzt: ${next < DAY_BLOCKS.length ? DAY_BLOCKS[next] : 'Schultag beendet'}`);
    } finally { busy = false; }
    await refreshRemote();
    return;
  }
  manualBlock = {index: next, autoAtSet: autoBlock()};
  toast(`Jetzt: ${blockName()}`);
  render();
}

function adminRemoveCover(id){

// Vertretung eintragen. Ohne gewählten Zeitraum gilt der ganze restliche Tag.
function adminAddCover(){

  if(!name || !adminForm.to){ toast('Bitte Namen und Klasse angeben.'); return; }
  const picked = DAY_BLOCKS.filter(b=>adminForm.blocks.includes(b));
  const blocks = (picked.length ? picked : DAY_BLOCKS.slice()).filter(isFutureBlock);
  if(blocks.length===0){ toast('Dieser Zeitraum ist schon vorbei.'); return; }

function adminAssign(){

    toast('Bitte Von-Klasse, Zu-Klasse und mindestens einen Zeitraum wählen.'); render(); return;
  }
  if(REMOTE) return remoteAssign();
  flows.push({id:flowIdSeq++, from:adminForm.from, to:adminForm.to, time:now(), active:true, blocks:adminForm.blocks.slice()});
  toast(`${classNameOf(adminForm.from)} → ${classNameOf(adminForm.to)} zugewiesen`);

}
function adminClearNeed(classId){

  if(REMOTE) return remoteClear(classId);

}

// ---------- Gemeinsamer Betrieb mit Supabase (nur aktiv, wenn in config.js eingerichtet) ----------
const ERR_TEXT = {
  netz: 'Keine Verbindung. Bitte gleich nochmal versuchen.',
  code: 'Der Schulcode stimmt nicht (mehr). Bitte neu eingeben.',
  token: 'Bitte als Schulleitung neu anmelden.',
  gesperrt: 'Zu viele Fehlversuche. Bitte in 15 Minuten erneut versuchen.',
  passwort: 'Falsches Passwort',
  schon_gedeckt: 'Schon gedeckt, jemand war schneller.',
  vergangen: 'Dieser Zeitraum ist schon vorbei.',
  kein_bedarf: 'Diese Klasse meldet gerade keinen Bedarf.',
  nicht_gefunden: 'Nicht mehr vorhanden.',
  zeitraum: 'Bitte zuerst einen Zeitraum wählen.',
  datum: 'Datum ungültig. Möglich ist heute bis in 6 Monaten.',
  keine_schultage: 'In diesem Zeitraum liegen keine Schultage.',
  ungueltig: 'Eingabe ungültig.'
};
let pendingPushes = 0;
let pushChain = Promise.resolve();

function berlinTime(iso){
  try{ return new Date(iso).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'}); }
  catch(e){ return ''; }
}
function handleRemoteFail(res){
  const e = res && res.error;
  toast(ERR_TEXT[e] || ERR_TEXT.netz);
  if(e === 'code'){
    remoteCode = ''; remoteLoaded = false;
    try{ localStorage.removeItem(CODE_KEY); }catch(x){}
    render();
  } else if(e === 'token'){
    adminToken = '';
    try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(STORAGE_KEY); }catch(x){}
    if(currentUser && currentUser.type === 'admin') currentUser = null;
    render();
  }
}
async function remoteCall(name, args){
  const res = await BACKEND.rpc(name, args);
  if(!res || !res.ok) handleRemoteFail(res);
  return res || {ok:false, error:'netz'};
}
function applyRemote(d){
  classes.forEach(c=>{
    if(c.id === myClassId && pendingPushes > 0) return; // eigene, noch nicht gespeicherte Änderung nicht überschreiben
    const row = (d.needs||[]).find(r=>r.class_id === c.id);
    c.need = row ? row.need : 0;
    if(c.need > 0) c.needBlocks = (row.blocks||[]).slice();
    else if(c.id !== myClassId) c.needBlocks = []; // eigene Auswahl bleibt als Entwurf stehen
  });
  const known = id => classes.some(c=>c.id === id);
  flows = (d.flows||[]).filter(f=>known(f.from_class) && known(f.to_class))
    .map(f=>({id:f.id, from:f.from_class, to:f.to_class, blocks:(f.blocks||[]).slice(), active:!!f.active, time:berlinTime(f.created_at)}));
  absent = (d.absent||[]).map(a=>({id:a.id, name:String(a.name), class_id:a.class_id, blocks:Array.isArray(a.blocks) ? a.blocks.filter(b=>DAY_BLOCKS.includes(b)) : []}));
  covers = (d.cover||[]).filter(v=>known(v.to_class))
    .map(v=>({id:v.id, name:String(v.name), to:v.to_class, blocks:(v.blocks||[]).slice(), active:true}));
  serverBlockIndex = Math.max(0, Math.min(Number(d.block_index)||0, DAY_BLOCKS.length));
  if(Array.isArray(d.block_ends)) blockEnds = d.block_ends.slice();
  scheduleBoundary();
}
// Während ein Auswahl- oder Eingabefeld aktiv ist, nicht neu zeichnen (sonst klappt es zu
// bzw. das Getippte geht verloren)
function safeRender(){
  const a = document.activeElement;
  if(a && (a.tagName === 'SELECT' || a.tagName === 'INPUT')){ renderDeferred = true; return; }
  render();
}
// Neu laden, höchstens alle 2 Sekunden, auch wenn viele Live-Signale kommen
let refreshing = false, refreshAgain = false, lastFetch = 0, refreshTimer = null;
function scheduleRefresh(delay){
  clearTimeout(refreshTimer);
  const wait = Math.max(delay || 300, 2000 - (Date.now() - lastFetch));
  refreshTimer = setTimeout(refreshRemote, wait);
}
async function refreshRemote(){
  if(!remoteCode) return;
  if(refreshing){ refreshAgain = true; return; }
  refreshing = true;
  lastFetch = Date.now();
  try{
    // Planung nur für angemeldete Klassen und Schulleitung, nicht für die Aula-Anzeige
    const wantPlan = !DISPLAY && !!currentUser;
    const [res, pl] = await Promise.all([
      BACKEND.fetchDay(remoteCode),
      wantPlan ? BACKEND.rpc('ph_fetch_plan', {p_code:remoteCode, p_from:null, p_to:null}) : Promise.resolve(null)
    ]);
    if(pl && pl.ok) applyPlan(pl);
    if(res && res.ok){
      applyRemote(res);
      remoteLoaded = true; remoteFailed = false; connectionOk = true;
      lastRefresh = now();
    } else if(res && (res.error === 'code' || res.error === 'gesperrt')){
      if(!remoteLoaded) remoteFailed = true;
      handleRemoteFail(res);
    } else {
      connectionOk = false;
      if(!remoteLoaded) remoteFailed = true;
    }
  } finally {
    refreshing = false;
  }
  safeRender();
  if(refreshAgain){ refreshAgain = false; scheduleRefresh(); }
}
async function startRemote(){
  if(remoteStarted){ await refreshRemote(); return; }
  remoteStarted = true;
  BACKEND.subscribe(()=>scheduleRefresh(150));
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) scheduleRefresh(0); });
  window.addEventListener('online', ()=>scheduleRefresh(0));
  setInterval(()=>scheduleRefresh(0), DISPLAY ? 30000 : 60000);
  await refreshRemote();
}
async function submitCode(){
  const el = document.getElementById('codeInput');
  const code = ((el && el.value) || '').trim();
  if(!code){ toast('Bitte den Schulcode eingeben.'); return; }
  if(busy) return;
  busy = true;
  let res;
  try{ res = await BACKEND.rpc('ph_login_code', {p_code:code}); }
  finally{ busy = false; }
  if(!res.ok){ toast(ERR_TEXT[res.error] || ERR_TEXT.netz); return; }
  remoteCode = code;
  remoteFailed = false;
  try{ localStorage.setItem(CODE_KEY, code); }catch(e){}
  if(el) el.blur();
  render();
  await startRemote();
}
async function remoteAdminLogin(pw){
  if(busy) return;
  busy = true;
  let res;
  try{ res = await remoteCall('ph_admin_login', {p_code:remoteCode, p_password:pw}); }
  finally{ busy = false; }
  if(!res.ok) return;
  adminToken = res.token;
  currentUser = {type:'admin'};
  try{ localStorage.setItem(TOKEN_KEY, adminToken); localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); }catch(e){}
  const el = document.getElementById('adminPw');
  if(el) el.blur();
  render();
}
// Bedarf speichern. Mehrere schnelle Klicks werden nacheinander gesendet, es gilt der letzte Stand.
function pushNeed(c){
  pendingPushes++;
  pushChain = pushChain.then(async ()=>{
    try{
      await remoteCall('ph_set_need', {p_code:remoteCode, p_class:c.id, p_need:c.need, p_blocks:c.needBlocks.slice()});
    }catch(e){
    }finally{
      pendingPushes--;
    }
    if(pendingPushes === 0) await refreshRemote(); // gleicht auch einen Fehlschlag mit dem Stand der Datenbank ab
  });
  return pushChain;
}
async function remoteSend(fromId, toId){
  if(busy) return;
  const from = classes.find(c=>c.id === fromId);
  const to = classes.find(c=>c.id === toId);
  const open = openBlocksFor(to);
  const chosen = (pendingSendBlocks[toId]||[]).filter(b=>open.includes(b));
  if(chosen.length === 0){ toast('Bitte mindestens einen Zeitraum auswählen.'); render(); return; }
  busy = true;
  try{
    const res = await remoteCall('ph_send', {p_code:remoteCode, p_from:fromId, p_to:toId, p_blocks:chosen});
    pendingSendBlocks[toId] = [];
    if(res.ok){
      const lost = chosen.filter(b=>!res.blocks.includes(b));
      toast(lost.length
        ? `Übernommen: ${res.blocks.join(', ')} (${lost.join(', ')} war schon vergeben)`
        : `${from.name} → ${to.name} · ${res.blocks.join(', ')}`);
    }
  } finally {
    busy = false;
  }
  await refreshRemote();
}
async function remoteEnd(id){
  if(busy) return;
  busy = true;
  try{
    const res = (currentUser && currentUser.type === 'admin')
      ? await remoteCall('ph_admin_end_flow', {p_token:adminToken, p_id:id})
      : await remoteCall('ph_end_flow', {p_code:remoteCode, p_class:myClassId, p_id:id});
    if(res.ok) toast('Unterstützung beendet');
  } finally { busy = false; }
  await refreshRemote();
}
async function remoteAssign(){
  if(busy) return;
  const form = {from:adminForm.from, to:adminForm.to, blocks:adminForm.blocks.slice()};
  busy = true;
  try{
    const res = await remoteCall('ph_admin_assign', {p_token:adminToken, p_from:form.from, p_to:form.to, p_blocks:form.blocks});
    if(res.ok){
      toast(`${classNameOf(form.from)} → ${classNameOf(form.to)} zugewiesen`);
      adminForm.blocks = [];
    }
  } finally { busy = false; }
  await refreshRemote();
}

// ---------- Rendering ----------
function setBodyMode(mode){
  if(typeof document === 'undefined' || !document.body || !document.body.classList) return;
  document.body.classList.toggle('desk', mode === 'desk');
  document.body.classList.toggle('display', mode === 'display');
}
function render(){
  saveState();
  const app = document.getElementById('app');
  setBodyMode(DISPLAY ? 'display' : null);
  if(DISPLAY && !REMOTE){
    app.innerHTML = `<header class="top"><div class="eyebrow">Personalhilfe</div><h1>Anzeige</h1></header><div class="card"><div class="empty">Die Anzeige braucht den gemeinsamen Betrieb mit Supabase.</div></div>`;
    return;
  }
  if(REMOTE){
    if(!remoteCode){ renderCodeGate(app); return; }
    if(!remoteLoaded){ renderLoading(app); return; }
  }
  if(DISPLAY){ renderDisplay(app); return; }
  if(!currentUser){ renderLogin(app); return; }
  if(currentUser.type==='admin'){ renderAdmin(app); return; }
  renderClassApp(app);
}

      <div class="block-row">

// ---------- Matrix: Klassen x Zeiträume ----------
function mxCellHTML(c, b, opts){
  const past = DAY_BLOCKS.indexOf(b) < curBlock();
  const req = needAt(c, b);
  const fromFlows = flows.filter(f=>f.active && f.to===c.id && f.blocks.includes(b)).map(f=>esc(classNameOf(f.from)));
  const fromCovers = covers.filter(v=>v.active!==false && v.to===c.id && v.blocks.includes(b)).map(v=>`<span class="mx-cv">${esc(v.name)}</span>`);
  const names = fromFlows.concat(fromCovers);
  const cnt = names.length;
  const onlyCovers = cnt > 0 && fromFlows.length === 0;
  let cls = 'mx-none', txt = '–';
  if(req > 0){
    // Häkchen und Namen in einem Element, sonst stapelt die Zelle sie untereinander
    if(cnt >= req){ cls = onlyCovers ? 'mx-ok mx-cover' : 'mx-ok'; txt = `<span>✓ ${names.join(', ')}</span>`; }
    else { cls = 'mx-open'; txt = `fehlt ${req - cnt}` + (cnt ? `<small>${names.join(', ')}</small>` : ''); }
  } else if(cnt > 0){
    cls = onlyCovers ? 'mx-ok mx-cover' : 'mx-ok'; txt = `<span>${names.join(', ')}</span>`;
  }
  if(past) cls += ' mx-past';
  let attr = '';
  if(opts.click && !past){
    const sel = adminForm.to === c.id && adminForm.blocks.includes(b);
    cls += ' mx-click' + (sel ? ' mx-sel' : '');
    attr = ` onclick="adminPickCell('${c.id}','${b}')"`;
  }
  return `<div class="${cls}"${attr}>${txt}</div>`;
}
function matrixHTML(opts){
  opts = opts || {};
  const cur = curBlock();
  const head = `<div class="mx-h">Klasse</div>` + DAY_BLOCKS.map((b,i)=>`<div class="mx-h ${i===cur?'mx-now':''}">${b}</div>`).join('');
  const rows = classes.map(c=>{
    const away = absent.filter(a=>a.class_id === c.id).map(a=>esc(a.name) + (a.blocks && a.blocks.length ? ` (${a.blocks.map(x=>x.replace('. Block','.')).join(', ')})` : ''));
    const label = `<div class="mx-name">${esc(c.name)}${away.length ? `<small>abwesend: ${away.join(', ')}</small>` : ''}</div>`;
    return label + DAY_BLOCKS.map(b=>mxCellHTML(c, b, opts)).join('');
  }).join('');
  return `<div class="mx" style="grid-template-rows:auto repeat(${classes.length},${opts.fill?'1fr':'auto'});">${head}${rows}</div>`;
}

// ---------- Planung im Voraus ----------
// Datumsangaben als 'JJJJ-MM-TT'. "Heute" nach deutscher Zeit wie in der Datenbank.
function isoToday(){
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Berlin', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
}
function isoAdd(iso, n){
  const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}
function isoWeekday(iso){ const w = new Date(iso + 'T12:00:00Z').getUTCDay(); return w === 0 ? 7 : w; } // 1 = Mo
function isoMonday(iso){ return isoAdd(iso, 1 - isoWeekday(iso)); }
const WD = ['','Mo','Di','Mi','Do','Fr','Sa','So'];
function fmtDay(iso){ const [y,m,d] = iso.split('-'); return `${WD[isoWeekday(iso)]} ${Number(d)}.${Number(m)}.`; }
function fmtRange(a, b){ return a === b ? fmtDay(a) : `${fmtDay(a)} – ${fmtDay(b)}`; }
function isoWeekNo(iso){
  const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - y0) / 86400000 + 1) / 7);
}

function applyPlan(d){
  const known = id => classes.some(c=>c.id === id);
  const blocksOf = x => Array.isArray(x) ? x.filter(b=>DAY_BLOCKS.includes(b)) : [];
  plan = {
    absent: (d.absent||[]).map(a=>({id:a.id, day:String(a.day), name:String(a.name), class_id:a.class_id, blocks:blocksOf(a.blocks), series:a.series||null})),
    cover: (d.cover||[]).filter(v=>known(v.to_class)).map(v=>({id:v.id, day:String(v.day), name:String(v.name), to:v.to_class, blocks:blocksOf(v.blocks), series:v.series||null})),
    free: (d.free||[]).map(f=>({day:String(f.day), label:String(f.label||'')})),
    loaded: true
  };
}
function freeDay(iso){ return plan.free.find(f=>f.day === iso) || null; }

// Zustand einer Klasse an einem Tag (heute zusätzlich mit gemeldetem Bedarf und Einsätzen)
function dayState(c, iso){
  const isToday = iso === isoToday();
  const abs = plan.absent.filter(a=>a.day === iso && a.class_id === c.id);
  const cov = plan.cover.filter(v=>v.day === iso && v.to === c.id);
  let open = 0, needed = 0;
  DAY_BLOCKS.forEach(b=>{
    if(isToday && !isFutureBlock(b)) return;
    let req = abs.filter(a=>absentBlocks(a).includes(b)).length;
    let got = cov.filter(v=>v.blocks.includes(b)).length;
    if(isToday){
      req = Math.max(req, (c.need > 0 && (c.needBlocks||[]).includes(b)) ? c.need : 0);
      got += flows.filter(f=>f.active && f.to===c.id && f.blocks.includes(b)).length;
    }
    if(req > 0){ needed++; if(got < req) open++; }
  });
  return {abs, cov, open, needed};
}

// Einträge zu Serien zusammenfassen (Einträge ohne Serie stehen einzeln)
function seriesGroups(list, kind){
  const map = new Map();
  list.forEach(x=>{
    const key = x.series || (kind + ':' + x.id);
    if(!map.has(key)) map.set(key, {key, kind, series:x.series, ids:[], name:x.name, classId: kind==='absent' ? x.class_id : x.to, blocks:x.blocks, days:[]});
    const g = map.get(key); g.ids.push(x.id); g.days.push(x.day);
  });
  return [...map.values()].map(g=>Object.assign(g, {first:g.days.slice().sort()[0], last:g.days.slice().sort().slice(-1)[0]}))
    .sort((a,b)=>a.first < b.first ? -1 : a.first > b.first ? 1 : 0);
}
function blocksText(blocks){ return (blocks && blocks.length && blocks.length < DAY_BLOCKS.length) ? blockLabel(blocks) : 'Ganzer Tag'; }

// ----- Aktionen -----
function setAdminTab(t){ adminTab = t; planSel = null; planForm.from = ''; planForm.to = ''; render(); }
function shiftWeek(n){ weekOffset = Math.max(0, Math.min(26, n === 0 ? 0 : weekOffset + n)); planSel = null; render(); }
function pickPlanCell(day, classId){
  planSel = (planSel && planSel.day === day && planSel.classId === classId) ? null : {day, classId};
  if(planSel){ planForm.from = day; planForm.to = day; planForm.classId = classId; }
  render();
}
function setPlanKind(k){ planForm.kind = k; planForm.from = ''; planForm.to = ''; render(); }
function togglePlanBlock(b){ const i = planForm.blocks.indexOf(b); if(i>=0) planForm.blocks.splice(i,1); else planForm.blocks.push(b); render(); }
function toggleClassPlanBlock(b){ const i = classPlanForm.blocks.indexOf(b); if(i>=0) classPlanForm.blocks.splice(i,1); else classPlanForm.blocks.push(b); render(); }
function normRange(f){
  const t = isoToday();
  const from = f.from || t; let to = f.to || from;
  if(to < from) to = from;
  return {from, to};
}
async function planCall(name, args, okText, after){
  if(busy) return;
  busy = true;
  try{
    const res = await remoteCall(name, args);
    if(res.ok){ toast(typeof okText === 'function' ? okText(res) : okText); if(after) after(); }
  } finally { busy = false; }
  await refreshRemote();
}
const daysText = res => res && res.days ? ` (${res.days} Schultag${res.days === 1 ? '' : 'e'})` : '';
function submitPlan(){
  const f = planForm, r = normRange(f), blocks = DAY_BLOCKS.filter(b=>f.blocks.includes(b));
  const reset = ()=>{ planForm.name = ''; planForm.blocks = []; planForm.label = ''; planForm.from = ''; planForm.to = ''; };
  if(f.kind === 'free'){
    return planCall('ph_admin_set_free', {p_token:adminToken, p_from:r.from, p_to:r.to, p_label:f.label||''}, res=>'Unterrichtsfrei eingetragen' + daysText(res), reset);
  }
  const name = (f.name||'').trim();
  if(!name){ toast('Bitte einen Namen eingeben.'); return; }
  if(f.kind === 'cover'){
    if(!f.classId){ toast('Bitte die Klasse wählen.'); return; }
    return planCall('ph_admin_plan_cover', {p_token:adminToken, p_name:name, p_to_class:f.classId, p_from:r.from, p_to:r.to, p_blocks:blocks},
      res=>`${name} vertritt in ${classNameOf(f.classId)}` + daysText(res), reset);
  }
  return planCall('ph_admin_plan_absent', {p_token:adminToken, p_name:name, p_class:f.classId||null, p_from:r.from, p_to:r.to, p_blocks:blocks},
    res=>'Abwesenheit eingetragen' + daysText(res), reset);
}
function removeGroup(key){
  const g = seriesGroups(plan.absent, 'absent').concat(seriesGroups(plan.cover, 'cover')).find(x=>x.key === key);
  if(!g) return;
  const what = g.kind === 'cover' ? `Vertretung ${g.name} → ${classNameOf(g.classId)}` : `Abwesenheit ${g.name}`;
  if(!confirm(`${what} (${fmtRange(g.first, g.last)}) entfernen?`)) return;
  if(g.series) return planCall('ph_admin_remove_series', {p_token:adminToken, p_series:g.series}, 'Entfernt');
  return planCall(g.kind === 'cover' ? 'ph_admin_remove_cover' : 'ph_admin_remove_absent', {p_token:adminToken, p_id:g.ids[0]}, 'Entfernt');
}
function removeFree(from, to){
  if(!confirm(`Unterrichtsfrei ${fmtRange(from, to)} entfernen?`)) return;
  return planCall('ph_admin_remove_free', {p_token:adminToken, p_from:from, p_to:to}, 'Entfernt');
}

function weekHTML(){

    else if(st.cov.length){ cls = 'mx-ok mx-cover'; txt = `<span>${who.join(', ')}</span>`; }

// Schulferien und gesetzliche Feiertage Hessen von OpenHolidays (openholidaysapi.org) holen.
// Erst Vorschau, übernommen wird nur auf Knopfdruck. Bewegliche Ferientage gibt es dort nicht.
let holidayPreview = null;   // null | 'loading' | [{from, to, label}]
function hasSchoolDay(from, to){ for(let d = from; d <= to; d = isoAdd(d, 1)){ if(isoWeekday(d) <= 5) return true; } return false; }
async function loadHessenHolidays(){
  holidayPreview = 'loading'; render();
  const from = isoToday(), until = isoAdd(from, 365);
  const q = `countryIsoCode=DE&subdivisionCode=DE-HE&languageIsoCode=DE&validFrom=${from}&validTo=${until}`;
  const get = async path => {
    const r = await fetch(`https://openholidaysapi.org/${path}?${q}`, {headers:{accept:'application/json'}});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if(!Array.isArray(j)) throw new Error('Format');
    return j;
  };
  const isoOk = x => /^\d{4}-\d{2}-\d{2}$/.test(x);
  // Bewegliche Ferientage aus config.js (Schulamt Weilburg), unabhängig vom Online-Dienst
  const moving = (Array.isArray(CFG.beweglicheFerientage) ? CFG.beweglicheFerientage : [])
    .map(x=>({from:String(x && x.day || ''), to:String(x && x.day || ''), label:String(x && x.label || 'Beweglicher Ferientag').slice(0, 40)}))
    .filter(x=>isoOk(x.from) && x.from >= from && x.from <= until && isoWeekday(x.from) <= 5);
  let school = [], pub = [], online = true;
  try{
    [school, pub] = await Promise.all([get('SchoolHolidays'), get('PublicHolidays')]);
  }catch(e){ online = false; }
  try{
    const label = h => { const n = (h.name||[]).find(x=>x.language==='DE') || (h.name||[])[0]; return String((n && n.text) || 'frei').slice(0, 40); };
    const seen = new Set();
    // Feiertage, die ganz in Schulferien liegen, nicht extra aufführen
    const inSchool = h => school.some(x=>String(x.startDate).slice(0,10) <= String(h.startDate).slice(0,10) && String(h.endDate).slice(0,10) <= String(x.endDate).slice(0,10));
    holidayPreview = school.concat(pub.filter(h=>!inSchool(h)))
      .map(h=>({from:String(h.startDate||'').slice(0,10), to:String(h.endDate||'').slice(0,10), label:label(h)}))
      .filter(x=>isoOk(x.from) && isoOk(x.to) && x.to >= from && x.from <= until)
      .map(x=>({from: x.from < from ? from : x.from, to: x.to > until ? until : x.to, label:x.label}))
      .filter(x=>hasSchoolDay(x.from, x.to))
      .concat(moving)
      .filter(x=>{ const k = x.from + x.to; if(seen.has(k)) return false; seen.add(k); return true; })
      .sort((a,b)=>a.from < b.from ? -1 : 1);
  }catch(e){
    holidayPreview = moving;
  }
  if(!online) toast(moving.length ? 'Ferien Hessen konnten nicht geladen werden. Vorschau zeigt nur die beweglichen Ferientage.' : 'Ferien konnten nicht geladen werden. Bitte von Hand eintragen.');
  if(!online && !moving.length) holidayPreview = null;
  render();
}
async function applyHolidays(){
  if(!Array.isArray(holidayPreview) || busy) return;
  busy = true;
  let okCount = 0, failCount = 0;
  try{
    for(const h of holidayPreview){
      const res = await BACKEND.rpc('ph_admin_set_free', {p_token:adminToken, p_from:h.from, p_to:h.to, p_label:h.label});
      if(res && res.ok) okCount++; else failCount++;
    }
  } finally { busy = false; }
  holidayPreview = null;
  toast(failCount ? `${okCount} übernommen, ${failCount} fehlgeschlagen` : `${okCount} Zeiträume als unterrichtsfrei übernommen`);
  await refreshRemote();
}
function discardHolidays(){ holidayPreview = null; render(); }
function holidayImportHTML(){
  if(holidayPreview === 'loading') return `<div class="hint">Lade Ferien und Feiertage …</div>`;
  if(Array.isArray(holidayPreview)){
    return `<label class="admin-label">Vorschau (${holidayPreview.length})</label>
      ${holidayPreview.length === 0 ? `<div class="empty">Nichts gefunden.</div>` : holidayPreview.map(h=>`<div class="person-row">
        <span>${esc(h.label)}</span><span style="color:var(--ink-soft)">· ${fmtRange(h.from, h.to)}</span></div>`).join('')}
      <div class="hint">Quellen: Ferien und Feiertage von OpenHolidays (openholidaysapi.org), bewegliche Ferientage aus config.js (Staatliches Schulamt Weilburg). Bitte kurz gegenprüfen. Bestehende Einträge an denselben Tagen werden überschrieben.</div>
      <div class="mode-row" style="margin-top:8px;">
        <button class="help-btn" style="flex:1;margin-top:0;" ${holidayPreview.length ? '' : 'disabled'} onclick="applyHolidays()">Übernehmen</button>
        <button class="switch-btn" onclick="discardHolidays()">Verwerfen</button>
      </div>`;
  }
  return `<button class="switch-btn" style="width:100%;margin-top:10px;" onclick="loadHessenHolidays()">Ferien und Feiertage Hessen laden</button>
    <div class="hint">Holt Schulferien und gesetzliche Feiertage Hessen für die nächsten 12 Monate, dazu die beweglichen Ferientage des Schulamts Weilburg aus config.js (einmal pro Schuljahr dort ergänzen).</div>`;
}
function freeListHTML(){
  // aufeinanderfolgende Schultage mit gleicher Bezeichnung zusammenfassen
  const runs = [];
  plan.free.forEach(f=>{
    const last = runs[runs.length-1];
    let gap = last ? last.to : null;
    if(gap){ do { gap = isoAdd(gap, 1); } while(isoWeekday(gap) > 5); }
    if(last && last.label === f.label && gap === f.day) last.to = f.day;
    else runs.push({from:f.day, to:f.day, label:f.label});
  });
  return `<div class="card">
    <h2>Unterrichtsfrei</h2>
    ${runs.length === 0 ? `<div class="empty">Keine freien Tage eingetragen.</div>` : runs.map(r=>`<div class="person-row">
        <span>${esc(r.label || 'frei')}</span><span style="color:var(--ink-soft)">· ${fmtRange(r.from, r.to)}</span>
        <button class="danger-btn" style="margin-left:auto;" onclick="removeFree('${r.from}','${r.to}')">Entfernen</button>
      </div>`).join('')}
    ${holidayImportHTML()}
  </div>`;
}
function adminTabsHTML(){
  return `<span class="seg" role="group" aria-label="Bereich">
    <button type="button" class="${adminTab==='heute'?'on':''}" onclick="setAdminTab('heute')">Heute</button>
    <button type="button" class="${adminTab==='plan'?'on':''}" onclick="setAdminTab('plan')">Planung</button>
  </span>`;
}
function planningBodyHTML(desk){
  if(!REMOTE) return `<div class="card"><div class="empty">Planung im Voraus gibt es nur im gemeinsamen Betrieb mit Supabase.</div></div>`;
  if(desk) return `<div class="desk-grid">
      <div>${weekHTML()}${planDetailHTML()}</div>
      <div>${planFormHTML()}${seriesListHTML()}${freeListHTML()}</div>
    </div>`;
  return weekHTML() + planDetailHTML() + planFormHTML() + seriesListHTML() + freeListHTML();
}
// Klasse: im Voraus melden und eigene Planung sehen
function classPlanCardHTML(mine){
  if(!REMOTE) return '';
  const f = classPlanForm;
  const groups = seriesGroups(plan.absent.filter(a=>a.class_id === mine.id), 'absent');
  const coverFor = g => {
    const cv = plan.cover.filter(v=>v.to === mine.id && g.days.includes(v.day));
    const byName = {};
    cv.forEach(v=>{ (byName[v.name] = byName[v.name] || []).push(v.day); });
    return Object.entries(byName).map(([n, ds])=>`${esc(n)} (${ds.length === g.days.length ? 'alle Tage' : ds.sort().map(fmtDay).join(', ')})`);
  };
  return `<div class="card">
    <h2>Im Voraus melden</h2>
    <input class="text-input" type="text" maxlength="60" autocomplete="off" placeholder="Wer fehlt? (Name, optional)" value="${esc(f.name)}" oninput="classPlanForm.name=this.value">
    ${dateFieldsHTML(f, 'classPlanForm')}
    <label class="admin-label">Zeitraum</label>
    <div class="block-row">${DAY_BLOCKS.map(b=>`<button type="button" class="block-chip ${f.blocks.includes(b)?'active':''}" onclick="toggleClassPlanBlock('${b}')">${b}</button>`).join('')}</div>
    <div class="hint">Ohne Zeitraum: ganzer Tag. Wochenenden und unterrichtsfreie Tage werden übersprungen. Bitte keine Gründe angeben.</div>
    <button class="help-btn" onclick="submitClassPlan()">Melden</button>
    <label class="admin-label">Geplant für ${esc(mine.name)}</label>
    ${groups.length === 0 ? `<div class="empty">Nichts geplant.</div>` : groups.map(g=>{
      const cv = coverFor(g);
      return `<div class="person-row">
        <span>${esc(g.name)}</span>
        <span style="color:var(--ink-soft)">· ${fmtRange(g.first, g.last)}${g.days.length > 1 ? ` (${g.days.length} Tage)` : ''} · ${blocksText(g.blocks)}</span>
        ${g.series ? `<button class="danger-btn" style="margin-left:auto;" onclick="classRemoveSeries('${g.series}')">Entfernen</button>` : ''}
        <div class="hint" style="width:100%;margin-top:2px;">${cv.length ? 'Vertretung geplant: ' + cv.join(', ') : 'Noch keine Vertretung geplant.'}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// ---------- Anzeige für den Bildschirm in der Aula ----------
function renderDisplay(app){
  const n = classes.filter(c=>needStatus(c)==='open').length;
  const cv = liveCovers();
  app.innerHTML = `
    <div class="dp">
      <header class="dp-head">
        <div>
          <div class="dp-date">${dateLine()}</div>
          <div class="dp-title">Personalübersicht</div>
        </div>
        <div class="dp-right">
          <div class="dp-block">Aktuell: ${blockName()}</div>
          <div class="dp-stat need"><b>${n}</b>Hilfe nötig</div>
          <div class="dp-stat flat"><b>${classes.length - n}</b>ausgeglichen</div>
          <div class="dp-stand">Stand<br>${lastRefresh || ''}</div>
        </div>
      </header>
      <div class="dp-body">
        <div class="dp-matrix">${matrixHTML({fill:true})}</div>
        <aside class="dp-side">
          <div class="card">
            <h2>Abwesend</h2>
            ${absent.length===0 ? `<div class="empty">Niemand gemeldet.</div>` :
              absent.map(a=>`<div class="person-row"><span>${esc(a.name)}</span>${a.class_id ? `<span style="color:var(--ink-soft)">· ${esc(classNameOf(a.class_id))}</span>` : ''}<span style="color:var(--ink-soft)">· ${absentLabel(a)}</span></div>`).join('')}
          </div>
          <div class="card">
            <h2>Vertretung</h2>
            ${cv.length===0 ? `<div class="empty">Keine Vertretung eingetragen.</div>` :
              cv.map(v=>`<div class="person-row"><b>${esc(v.name)}</b><span>in ${esc(classNameOf(v.to))}</span><span style="color:var(--ink-soft)">· ${blockLabel(v.blocks)}</span></div>`).join('')}
          </div>
        </aside>
      </div>
      ${connectionOk ? '' : '<div class="dp-offline">Keine Verbindung. Die Anzeige kann veraltet sein.</div>'}
    </div>
  `;
}

if(typeof window.addEventListener === 'function'){
  window.addEventListener('resize', ()=>{
    if(DISPLAY || !currentUser || currentUser.type !== 'admin') return;
    const d = isDesktopView();
    if(d !== lastDesktop) safeRender();
  });
  window.addEventListener('hashchange', ()=>{ if(typeof location !== 'undefined' && location.reload) location.reload(); });
}

initApp();
</script>
</body>
</html>
