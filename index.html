<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personalhilfe</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F6F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Personalhilfe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#F6F7F3;
    --card:#FFFFFF;
    --ink:#22302A;
    --ink-soft:#5B6960;
    --ink-light:#93A196;
    --teal:#2F6F63;
    --teal-deep:#1F4C43;
    --amber:#E1972F;
    --amber-soft:#FBEBD3;
    --line:#DFE4DD;
    --danger:#C1543A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;padding:20px 16px 90px;}
  header.top{padding:4px 2px 18px;}
  .eyebrow{font-size:13px;color:var(--ink-light);}
  h1{font-size:24px;margin:2px 0 0;font-weight:650;letter-spacing:-0.01em;color:#4B5C52;}

  .session-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;font-size:13px;color:var(--ink-soft);
  }
  .switch-btn{
    border:none;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);
    border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .switch-btn:active{background:var(--line);}

  .block-progress{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;padding:9px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;
  }
  .current-block{font-size:13px;font-weight:600;color:var(--teal-deep);}
  .advance-btn{
    border:none;background:var(--bg);color:var(--ink-soft);border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .advance-btn:active{background:var(--line);}
  .block-progress-caption{font-size:11px;color:var(--ink-soft);margin-top:6px;padding:0 2px;}

  .notify-btn{
    border:1px dashed var(--line);background:transparent;color:var(--teal-deep);
    border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:600;
    cursor:pointer;width:100%;margin-top:12px;
  }

  .overview-card{padding:14px;}
  .overview-summary{display:flex;gap:10px;margin-bottom:12px;}
  .ov-stat{
    flex:1;border-radius:12px;padding:9px 6px;text-align:center;
    font-size:11.5px;color:var(--ink-soft);font-weight:600;
  }
  .ov-stat span{display:block;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:1px;}
  .ov-stat.ov-need{background:var(--amber-soft);}
  .ov-stat.ov-flat{background:var(--bg);}

  .ov-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  }
  .ov-cell{
    border-radius:11px;padding:9px 8px;cursor:pointer;border:1.5px solid transparent;
  }
  .ov-cell.ov-need{background:var(--amber-soft);}
  .ov-cell.ov-flat{background:var(--bg);}
  .ov-cell.ov-mine{border-color:var(--teal);}
  .ov-name{font-size:12.5px;font-weight:700;color:var(--ink);}
  .ov-label{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  .stepper-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 2px;border-top:1px solid var(--line);margin-top:10px;
  }
  .stepper-label{font-size:14px;font-weight:600;color:var(--ink);}
  .stepper-btns{display:flex;gap:8px;}
  .step-btn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);font-size:17px;font-weight:600;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .step-btn:active{background:var(--bg);}
  .step-btn:disabled{color:var(--line);cursor:default;}

  .block-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .block-chip{
    font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
    color:var(--ink-soft);cursor:pointer;background:var(--card);
  }
  .block-chip.small{font-size:11px;padding:4px 8px;}
  .block-chip.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
  .block-chip.covered{background:#E4F1EC;border-color:transparent;color:var(--teal-deep);cursor:default;font-weight:600;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px;
  }
  .card h2{font-size:12.5px;text-transform:none;color:var(--ink-soft);
    margin:0 0 10px;font-weight:600;}
  .mine .name{font-size:19px;font-weight:650;}

  .need-card{border-left:3px solid var(--amber);}
  .need-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .need-title{font-size:16px;font-weight:600;}
  .need-sub{font-size:13px;color:var(--ink-soft);margin-top:3px;}
  .status-pill{
    display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;
    margin-top:8px;font-weight:600;background:var(--amber-soft);color:#8A5A14;
  }

  button.help-btn{
    border:none;background:var(--teal);color:#fff;border-radius:11px;
    padding:10px 16px;font-size:14.5px;font-weight:600;cursor:pointer;
    width:100%;margin-top:10px;transition:.15s;
  }
  button.help-btn:active{transform:scale(0.98);}
  button.help-btn:disabled{background:var(--line);color:var(--ink-soft);cursor:default;}

  button.ghost-btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;
  }
  button.danger-btn{
    border:none;background:none;color:var(--danger);font-size:12px;cursor:pointer;
  }

  .empty{color:var(--ink-soft);font-size:13.5px;padding:6px 2px;}

  .flow-row{
    display:flex;align-items:center;gap:8px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap;
  }
  .flow-row:last-child{border-bottom:none;}
  .flow-badge{
    background:var(--teal-deep);color:#fff;border-radius:8px;
    padding:3px 8px;font-size:12.5px;font-weight:600;
  }
  .flow-arrow{color:var(--ink-soft);}
  .flow-time{margin-left:auto;font-size:12px;color:var(--ink-soft);}

  .admin-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:14px;display:block;}
  .admin-label:first-child{margin-top:0;}
  .admin-select{
    width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);font-size:14px;color:var(--ink);margin-top:6px;
  }

  .login-list{display:flex;flex-direction:column;gap:8px;}
  .login-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    cursor:pointer;background:var(--card);
  }
  .login-row:active{background:var(--bg);}
  .login-hint{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  .local-note{margin-top:12px;padding:8px 11px;background:var(--amber-soft);color:#8A5A14;border-radius:10px;font-size:12px;line-height:1.35;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--teal-deep);color:#fff;padding:10px 18px;border-radius:12px;
    font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:85vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
// ---------- Konfiguration (siehe config.js) ----------
const DAY_BLOCKS = ['1. Block','2. Block','Mittagessen','3. Block'];
const USER_CFG = window.PERSONALHILFE_CONFIG || {};
const CFG = Object.assign({
  classes: ['Klasse A','Klasse B','Klasse C'],
  adminPasswordHash: '',
  demoData: false,
  localOnlyNotice: true
}, USER_CFG);
CFG.features = Object.assign({notifications:false}, USER_CFG.features || {});
const STORAGE_KEY = 'personalhilfe.user';
const STATE_KEY = 'personalhilfe.state';

// ---------- Zustand ----------
function slug(str){ return String(str).toLowerCase().replace(/[^a-z0-9]+/g,'') || 'k'; }
let classes = (()=>{
  const seen = {};
  return CFG.classes.map((name,i)=>{
    let id = slug(name);
    if(seen[id]) id = id + '_' + i;
    seen[id] = 1;
    return {id, name:String(name), need:0, needBlocks:[]};
  });
})();
let flows = [];
if(CFG.demoData && classes.length >= 4){
  classes[0].need = 1; classes[0].needBlocks = DAY_BLOCKS.slice();
  classes[2].need = 2; classes[2].needBlocks = DAY_BLOCKS.slice();
  classes[3].need = 1; classes[3].needBlocks = ['Mittagessen'];
  flows = [{id:0, from:classes[1].id, to:classes[0].id, time:'08:55', active:true, blocks:['1. Block','2. Block']}];
}
let flowIdSeq = flows.length;
let currentBlockIndex = 0;
let currentUser = null; // {type:'class', classId} | {type:'admin'} | null
let myClassId = null;
let pendingSendBlocks = {};
let adminForm = {from:'', to:'', blocks:[]};

// ---------- Lokale Speicherung (pro Gerät, nur für den heutigen Tag) ----------
function todayKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function saveState(){
  try{
    localStorage.setItem(STATE_KEY, JSON.stringify({
      day: todayKey(),
      classes: classes.map(c=>({id:c.id, need:c.need, needBlocks:c.needBlocks})),
      flows, flowIdSeq, currentBlockIndex
    }));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(!raw) return;
    const st = JSON.parse(raw);
    if(st.day !== todayKey()) return; // neuer Tag: frisch starten
    classes.forEach(c=>{
      const o = (st.classes||[]).find(x=>x.id===c.id);
      if(o){ c.need = o.need; c.needBlocks = o.needBlocks || []; }
    });
    flows = (st.flows||[]).filter(f=>classes.some(c=>c.id===f.from) && classes.some(c=>c.id===f.to));
    flowIdSeq = st.flowIdSeq || flows.length;
    currentBlockIndex = Math.min(st.currentBlockIndex||0, DAY_BLOCKS.length-1);
  }catch(e){}
}

function classNameOf(id){ const c = classes.find(x=>x.id===id); return c? c.name : id; }

function requiredBlocks(c){
  if(c.need <= 0) return [];
  const chosen = c.needBlocks || [];
  return chosen.length>0 ? DAY_BLOCKS.filter(b=>chosen.includes(b)) : DAY_BLOCKS.slice();
}
function blockLabel(arr){
  if(!arr || arr.length===0) return 'Ganzer Tag';
  if(DAY_BLOCKS.every(b=>arr.includes(b))) return 'Ganzer Tag';
  return DAY_BLOCKS.filter(b=>arr.includes(b)).join(', ');
}
function coverCount(classId, block){
  return flows.filter(f=>f.active && f.to===classId && f.blocks.includes(block)).length;
}
function openBlocksFor(c){
  return requiredBlocks(c).filter(b=>coverCount(c.id,b) < c.need);
}
function needStatus(c){
  if(c.need <= 0) return null;
  return openBlocksFor(c).length===0 ? 'done' : 'open';
}

function now(){
  return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2400);
}
function maybeNotify(title, body){
  if(!CFG.features.notifications) return;
  if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
    try{ new Notification(title, {body}); } catch(e){}
  }
}
async function enableNotifications(){
  if(typeof Notification === 'undefined'){ toast('Push wird von diesem Browser nicht unterstützt.'); return; }
  try{
    const perm = await Notification.requestPermission();
    toast(perm==='granted' ? 'Benachrichtigungen aktiviert' : 'Ohne Erlaubnis kein Hinweis-Ton');
  }catch(e){}
  render();
}

// ---------- Login / Rollen ----------
async function selectClass(id){
  currentUser = {type:'class', classId:id};
  myClassId = id;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); }catch(e){}
  render();
}
async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function loginAsAdmin(){
  if(!CFG.adminPasswordHash){ toast('Der Schulleitungs-Zugang ist nicht eingerichtet.'); return; }
  const pw = prompt('Passwort für Schulleitung:');
  if(pw === null) return;
  let ok = false;
  try{ ok = (await sha256(pw.trim())) === CFG.adminPasswordHash; }
  catch(e){ toast('Passwortprüfung ist in diesem Browser nicht möglich.'); return; }
  if(!ok){ toast('Falsches Passwort'); return; }
  currentUser = {type:'admin'};
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(currentUser)); }catch(e){}
  render();
}
async function switchUser(){
  currentUser = null; myClassId = null;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  render();
}
async function initApp(){
  loadState();
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const u = JSON.parse(raw);
      if(u.type==='admin' || (u.type==='class' && classes.some(c=>c.id===u.classId))){
        currentUser = u;
        if(u.type==='class') myClassId = u.classId;
      }
    }
  }catch(e){ /* noch keine Auswahl gespeichert */ }
  render();
}

// ---------- Aktionen ----------
function toggleSendBlock(classId, block){
  const arr = pendingSendBlocks[classId] || (pendingSendBlocks[classId] = []);
  const i = arr.indexOf(block);
  if(i>=0) arr.splice(i,1); else arr.push(block);
  render();
}
function sendHelp(fromId, toId){
  const from = classes.find(c=>c.id===fromId);
  const to = classes.find(c=>c.id===toId);
  const open = openBlocksFor(to);
  const already = new Set(flows.filter(f=>f.active && f.from===fromId && f.to===toId).flatMap(f=>f.blocks));
  const chosen = (pendingSendBlocks[toId]||[]).filter(b=>open.includes(b) && !already.has(b));
  if(chosen.length===0){ toast('Bitte mindestens einen Zeitraum auswählen.'); render(); return; }
  flows.push({id:flowIdSeq++, from:fromId, to:toId, time:now(), active:true, blocks:chosen});
  pendingSendBlocks[toId] = [];
  toast(`${from.name} → ${to.name} · ${chosen.join(', ')}`);
  render();
}
function toggleNeedBlock(classId, block){
  const c = classes.find(x=>x.id===classId);
  if(block === 'Ganzer Tag'){
    const allSelected = DAY_BLOCKS.every(b=>c.needBlocks.includes(b));
    c.needBlocks = allSelected ? [] : DAY_BLOCKS.slice();
  } else {
    const i = c.needBlocks.indexOf(block);
    if(i>=0) c.needBlocks.splice(i,1); else c.needBlocks.push(block);
  }
  render();
}
function requestNeed(classId, qty){
  const c = classes.find(x=>x.id===classId);
  const wasZero = c.need <= 0;
  c.need = Math.max(0, c.need + qty);
  if(c.need <= 0) c.needBlocks = [];
  if(qty>0){
    toast(`Bedarf gemeldet: +${qty} Erwachsene(r) für ${c.name}`);
    if(wasZero) maybeNotify('Personalbedarf', `${c.name} braucht Unterstützung (${blockLabel(c.needBlocks)})`);
  } else {
    toast('Rückgängig gemacht');
  }
  render();
}
function endFlow(id){
  const f = flows.find(x=>x.id===id);
  if(!f) return;
  f.active = false;
  toast('Unterstützung beendet');
  render();
}
function advanceBlock(){
  const endingBlock = DAY_BLOCKS[currentBlockIndex];
  flows.filter(f=>f.active).forEach(f=>{
    f.blocks = f.blocks.filter(b=>b!==endingBlock);
    if(f.blocks.length===0) f.active = false;
  });
  if(currentBlockIndex < DAY_BLOCKS.length-1){
    currentBlockIndex++;
    toast(`${endingBlock} beendet — jetzt: ${DAY_BLOCKS[currentBlockIndex]}`);
  } else {
    toast(`${endingBlock} beendet — Schultag zu Ende`);
  }
  render();
}

// ---------- Schulleitung ----------
function setAdminField(field, value){ adminForm[field] = value; render(); }
function toggleAdminBlock(block){
  const i = adminForm.blocks.indexOf(block);
  if(i>=0) adminForm.blocks.splice(i,1); else adminForm.blocks.push(block);
  render();
}
function adminAssign(){
  if(!adminForm.from || !adminForm.to || adminForm.from===adminForm.to || adminForm.blocks.length===0){
    toast('Bitte Von-Klasse, Zu-Klasse und mindestens einen Zeitraum wählen.'); return;
  }
  flows.push({id:flowIdSeq++, from:adminForm.from, to:adminForm.to, time:now(), active:true, blocks:adminForm.blocks.slice()});
  toast(`${classNameOf(adminForm.from)} → ${classNameOf(adminForm.to)} zugewiesen`);
  adminForm.blocks = [];
  render();
}
function adminClearNeed(classId){
  const c = classes.find(x=>x.id===classId);
  c.need = 0; c.needBlocks = [];
  toast(`Bedarf von ${c.name} geschlossen`);
  render();
}

// ---------- Rendering ----------
function render(){
  saveState();
  const app = document.getElementById('app');
  if(!currentUser){ renderLogin(app); return; }
  if(currentUser.type==='admin'){ renderAdmin(app); return; }
  renderClassApp(app);
}

function localNotice(){
  return CFG.localOnlyNotice
    ? '<div class="local-note">Hinweis: Eingaben bleiben auf diesem Gerät. Andere Handys sehen sie noch nicht.</div>'
    : '';
}

function dateLine(){
  return new Date().toLocaleDateString('de-DE',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

function renderLogin(app){
  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Personalhilfe</div>
      <h1>Wer bist du?</h1>
      ${localNotice()}
    </header>
    <div class="card">
      <h2>Deine Klasse</h2>
      <div class="login-list">
        ${classes.map(c=>`<div class="login-row" onclick="selectClass('${c.id}')"><span>${c.name}</span><span style="color:var(--ink-light)">›</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Schulleitung</h2>
      <button class="help-btn" onclick="loginAsAdmin()">Als Schulleitung anmelden</button>
      <div class="login-hint">Passwortgeschützt · gibt Zugriff auf alle Klassen</div>
    </div>
  `;
}

function renderClassApp(app){
  const mine = classes.find(c=>c.id===myClassId);
  const others = classes.filter(c=>c.id!==myClassId);
  const openNeeds = others.filter(c=>needStatus(c)==='open');
  const activeFlows = flows.filter(f=>f.active);
  const needClasses = classes.filter(c=>needStatus(c)==='open');
  const balancedClasses = classes.filter(c=>needStatus(c)!=='open');
  const notifyReady = typeof Notification !== 'undefined' && Notification.permission === 'granted';

  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Heute · ${dateLine()}</div>
      <h1>Personalübersicht</h1>
      <div class="session-bar">
        <span>Angemeldet als ${mine.name}</span>
        <button class="switch-btn" onclick="switchUser()">Neu wählen</button>
      </div>
      <div class="block-progress">
        <span class="current-block">Aktuell: ${DAY_BLOCKS[currentBlockIndex]}</span>
      </div>
      ${(!CFG.features.notifications || notifyReady)? '' : `<button class="notify-btn" onclick="enableNotifications()">🔔 Benachrichtigungen aktivieren</button>`}
      ${localNotice()}
    </header>

    <div class="card overview-card">
      <div class="overview-summary">
        <div class="ov-stat ov-need"><span>${needClasses.length}</span>Hilfe nötig</div>
        <div class="ov-stat ov-flat"><span>${balancedClasses.length}</span>ausgeglichen</div>
      </div>
      <div class="ov-grid">
        ${classes.map(c=>{
          const st = needStatus(c);
          const isMine = c.id===myClassId;
          let cls='ov-flat', label='ausgeglichen';
          if(st==='open'){
            cls='ov-need';
            const open = openBlocksFor(c);
            const req = requiredBlocks(c);
            label = open.length===req.length ? `braucht: ${blockLabel(c.needBlocks)}` : `offen: ${open.join(', ')}`;
          }
          return `<div class="ov-cell ${cls} ${isMine?'ov-mine':''}">
            <div class="ov-name">${c.name}${isMine?' · du':''}</div>
            <div class="ov-label">${label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h2>Deine Klasse</h2>
      <div class="mine"><div class="name">${mine.name}</div></div>
      <div class="stepper-row">
        <span class="stepper-label">Bedarf: ${mine.need}</span>
        <div class="stepper-btns">
          <button class="step-btn" ${mine.need<=0?'disabled':''} onclick="requestNeed('${mine.id}',-1)">−</button>
          <button class="step-btn" onclick="requestNeed('${mine.id}',1)">+</button>
        </div>
      </div>
      <div class="block-row">
        ${DAY_BLOCKS.map(b=>`<span class="block-chip ${mine.needBlocks.includes(b)?'active':''}" onclick="toggleNeedBlock('${mine.id}','${b}')">${b}</span>`).join('')}
        <span class="block-chip ${DAY_BLOCKS.every(b=>mine.needBlocks.includes(b))?'active':''}" onclick="toggleNeedBlock('${mine.id}','Ganzer Tag')">Ganzer Tag</span>
      </div>
    </div>

    <div class="card">
      <h2>Aktuelle Situation</h2>
      ${openNeeds.length===0? `<div class="empty">Gerade meldet keine andere Klasse Bedarf.</div>` :
        openNeeds.map(c=>{
          const req = requiredBlocks(c);
          const open = openBlocksFor(c);
          const chosen = pendingSendBlocks[c.id] || [];
          const partial = open.length < req.length;
          return `
          <div class="need-card" style="margin-bottom:14px;">
            <div class="need-row">
              <div>
                <div class="need-title">${c.name} braucht Unterstützung</div>
                <div class="need-sub">${partial? `Noch offen: ${open.join(', ')}` : `Zeitraum: ${blockLabel(c.needBlocks)}`}</div>
              </div>
            </div>
            <span class="status-pill">offen</span>
            <div class="block-row" style="margin-top:10px;">
              ${req.map(b=>{
                const isOpen = open.includes(b);
                const isChosen = chosen.includes(b);
                if(!isOpen) return `<span class="block-chip covered">✓ ${b}</span>`;
                return `<span class="block-chip small ${isChosen?'active':''}" onclick="toggleSendBlock('${c.id}','${b}')">${b}</span>`;
              }).join('')}
            </div>
            <button class="help-btn" ${chosen.length===0?'disabled':''} onclick="sendHelp('${mine.id}','${c.id}')">
              ${chosen.length===0? 'Zeitraum(e) wählen' : `Schicken für: ${chosen.join(', ')}`}
            </button>
          </div>`;
        }).join('')
      }
    </div>

    <div class="card">
      <h2>Aktive Unterstützung</h2>
      ${activeFlows.length===0? `<div class="empty">Momentan läuft kein Personalaustausch.</div>` :
        activeFlows.map(f=>{
          const from = classes.find(c=>c.id===f.from);
          const to = classes.find(c=>c.id===f.to);
          return `<div class="flow-row">
            <span class="flow-badge">${from.name}</span>
            <span class="flow-arrow">→</span>
            <span class="flow-badge" style="background:var(--teal)">${to.name}</span>
            <span style="color:var(--ink-soft)">· ${f.blocks.join(', ')}</span>
            <span class="flow-time">${f.time}</span>
            ${(f.from===mine.id||f.to===mine.id)? `<button class="danger-btn" onclick="endFlow(${f.id})">beenden</button>`:''}
          </div>`;
        }).join('')
      }
    </div>
  `;
}

function renderAdmin(app){
  const activeFlows = flows.filter(f=>f.active);
  const openNeedClasses = classes.filter(c=>needStatus(c)==='open');
  const needClasses = openNeedClasses;
  const balancedClasses = classes.filter(c=>needStatus(c)!=='open');

  app.innerHTML = `
    <header class="top">
      <div class="eyebrow">Heute · ${dateLine()}</div>
      <h1>Schulleitung</h1>
      <div class="session-bar">
        <span>Master-Kontrolle</span>
        <button class="switch-btn" onclick="switchUser()">Neu wählen</button>
      </div>
      <div class="block-progress">
        <span class="current-block">Aktuell: ${DAY_BLOCKS[currentBlockIndex]}</span>
        <button class="advance-btn" onclick="advanceBlock()">${currentBlockIndex<DAY_BLOCKS.length-1? DAY_BLOCKS[currentBlockIndex]+' beenden ›' : 'Schultag beenden'}</button>
      </div>
      <div class="block-progress-caption">Zusagen für nur diesen Zeitraum laufen dann automatisch ab</div>
      ${localNotice()}
    </header>

    <div class="card overview-card">
      <div class="overview-summary">
        <div class="ov-stat ov-need"><span>${needClasses.length}</span>Hilfe nötig</div>
        <div class="ov-stat ov-flat"><span>${balancedClasses.length}</span>ausgeglichen</div>
      </div>
      <div class="ov-grid">
        ${classes.map(c=>{
          const st = needStatus(c);
          let cls='ov-flat', label='ausgeglichen';
          if(st==='open'){
            cls='ov-need';
            const open = openBlocksFor(c);
            const req = requiredBlocks(c);
            label = open.length===req.length ? `braucht: ${blockLabel(c.needBlocks)}` : `offen: ${open.join(', ')}`;
          }
          return `<div class="ov-cell ${cls}" style="cursor:default;">
            <div class="ov-name">${c.name}</div>
            <div class="ov-label">${label}</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <h2>Alle offenen Bedarfe</h2>
      ${openNeedClasses.length===0? `<div class="empty">Aktuell meldet keine Klasse Bedarf.</div>` :
        openNeedClasses.map(c=>{
          const open = openBlocksFor(c);
          return `<div class="flow-row">
            <span class="flow-badge" style="background:var(--amber);color:#4A3200;">${c.name}</span>
            <span style="color:var(--ink-soft)">offen: ${open.join(', ')}</span>
            <button class="danger-btn" style="margin-left:auto;" onclick="adminClearNeed('${c.id}')">Bedarf schließen</button>
          </div>`;
        }).join('')
      }
    </div>

    <div class="card">
      <h2>Personal manuell zuweisen</h2>
      <label class="admin-label">Von Klasse</label>
      <select class="admin-select" onchange="setAdminField('from', this.value)">
        <option value="">– wählen –</option>
        ${classes.map(c=>`<option value="${c.id}" ${adminForm.from===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <label class="admin-label">Zu Klasse</label>
      <select class="admin-select" onchange="setAdminField('to', this.value)">
        <option value="">– wählen –</option>
        ${classes.map(c=>`<option value="${c.id}" ${adminForm.to===c.id?'selected':''}>${c.name}</option>`).join('')}
      </select>
      <label class="admin-label">Zeitraum</label>
      <div class="block-row">
        ${DAY_BLOCKS.map(b=>`<span class="block-chip ${adminForm.blocks.includes(b)?'active':''}" onclick="toggleAdminBlock('${b}')">${b}</span>`).join('')}
      </div>
      <button class="help-btn" onclick="adminAssign()">Zuweisen</button>
    </div>

    <div class="card">
      <h2>Alle aktiven Einsätze</h2>
      ${activeFlows.length===0? `<div class="empty">Momentan läuft kein Personalaustausch.</div>` :
        activeFlows.map(f=>{
          const from = classes.find(c=>c.id===f.from);
          const to = classes.find(c=>c.id===f.to);
          return `<div class="flow-row">
            <span class="flow-badge">${from.name}</span>
            <span class="flow-arrow">→</span>
            <span class="flow-badge" style="background:var(--teal)">${to.name}</span>
            <span style="color:var(--ink-soft)">· ${f.blocks.join(', ')}</span>
            <span class="flow-time">${f.time}</span>
            <button class="danger-btn" onclick="endFlow(${f.id})">beenden</button>
          </div>`;
        }).join('')
      }
    </div>
  `;
}

initApp();
</script>
</body>
</html>
